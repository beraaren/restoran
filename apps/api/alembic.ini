# Alembic config — restoran-api domain (kimlik) migration'ları.
#
# Komutlar REPO KÖKÜNDEN çalışır:
#   uv run alembic -c apps/api/alembic.ini revision --autogenerate -m "..."
#   uv run alembic -c apps/api/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
