[project]
name = "restoran-api"
version = "0.1.0"
description = "FastAPI monoliti: auth, domain, ingestion, panel/floor/kds API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "restoran-contracts",
    "restoran-reconcile",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restoran"]

[tool.uv.sources]
restoran-contracts = { workspace = true }
restoran-reconcile = { workspace = true }
