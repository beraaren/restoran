[project]
name = "restoran-workspace"
version = "0.1.0"
description = "Restoran yonetim + kamera denetim urunu — uv workspace kok projeksi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "restoran-contracts",
    "restoran-vision",
    "restoran-reconcile",
    "restoran-api",
]

[tool.uv.workspace]
members = ["packages/*", "services/*", "apps/*"]

[tool.uv.sources]
restoran-contracts = { workspace = true }
restoran-vision = { workspace = true }
restoran-reconcile = { workspace = true }
restoran-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
