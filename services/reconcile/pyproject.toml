[project]
name = "restoran-reconcile"
version = "0.1.0"
description = "Mutabakat/denetim motoru: vision-POS caprazlama + aktor durum makinesi"
requires-python = ">=3.12,<3.13"
dependencies = ["restoran-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restoran"]

[tool.uv.sources]
restoran-contracts = { workspace = true }
