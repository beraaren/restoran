[project]
name = "restoran-vision"
version = "0.1.0"
description = "Kamera gorsel isleme servisi: YOLO+takip+zone gecis motoru"
requires-python = ">=3.12,<3.13"
dependencies = [
    "restoran-contracts",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restoran"]

[tool.uv.sources]
restoran-contracts = { workspace = true }
